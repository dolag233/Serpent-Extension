name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use the pinned Node release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build extension (Chromium + Firefox)
        run: npm run extension:build

      - name: Lint Firefox build (web-ext)
        run: npm run extension:lint:firefox

      - name: Package zips (manifest.json at zip root for Load unpacked)
        run: |
          cd dist/extension
          zip -r ../../serpent-extension-${{ github.ref_name }}.zip . -x '*.map'
          cd ../..
          sha256sum serpent-extension-${{ github.ref_name }}.zip > serpent-extension-${{ github.ref_name }}.zip.sha256
          cd dist/extension-firefox
          zip -r ../../serpent-extension-firefox-${{ github.ref_name }}.zip . -x '*.map'
          cd ../..
          sha256sum serpent-extension-firefox-${{ github.ref_name }}.zip > serpent-extension-firefox-${{ github.ref_name }}.zip.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            serpent-extension-${{ github.ref_name }}.zip
            serpent-extension-${{ github.ref_name }}.zip.sha256
            serpent-extension-firefox-${{ github.ref_name }}.zip
            serpent-extension-firefox-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true
