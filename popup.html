<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serpent</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body class="popup">
    <main>
      <h1>Serpent</h1>

      <section class="options-section">
        <h2>保存目标</h2>
        <label class="options-toggle">
          <input id="save-target-folder" name="save-target-kind" type="radio" value="folder">
          <span>保存到文件夹</span>
        </label>
        <label class="options-toggle">
          <input id="save-target-collection" name="save-target-kind" type="radio" value="collection">
          <span>保存到合集</span>
        </label>
        <p class="options-hint">保存到合集时，文件进入资源库根目录，并加入所选合集。</p>
      </section>

      <section class="options-section">
        <label class="options-toggle">
          <input id="notifications-enabled" type="checkbox">
          <span>保存后显示系统通知</span>
        </label>
        <label class="options-toggle">
          <input id="focus-app-after-save" type="checkbox">
          <span>保存后显示 Serpent 窗口</span>
        </label>
        <label class="options-toggle">
          <input id="reveal-in-library-after-save" type="checkbox">
          <span>保存后跳转到目标文件夹并选中文件</span>
        </label>
        <label class="options-toggle">
          <input id="drag-radial-menu-enabled" type="checkbox">
          <span>拖拽网页图片/视频时显示树状保存菜单</span>
        </label>
      </section>

      <p id="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
